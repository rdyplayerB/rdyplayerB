name: Gold contribution graph

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render banner + contribution graph (dark and light)
        run: python3 scripts/hero.py rdyplayerB assets/hero.svg assets/hero-light.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.svg assets/hero-light.svg
          git diff --cached --quiet || (git commit -m "Update banner contribution graph [skip ci]" && git push)
